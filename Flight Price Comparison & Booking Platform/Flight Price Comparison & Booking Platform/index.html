<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FlyCompare - Compare flight prices from hundreds of airlines and travel agents. Find the best deals and book your flights easily." />
  <title>FlyCompare — Flight Price Comparison & Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== CSS VARIABLES / DESIGN TOKENS ===== */
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --secondary-color: #0ea5e9;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-light: #e2e8f0;
      --accent-purple: #8b5cf6;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-floating: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
      --transition-fast: 150ms ease;
      --transition-normal: 300ms ease;
    }

    /* ===== RESET ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      color: var(--text-main);
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    img { max-width: 100%; }

    /* ===== UTILITIES ===== */
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
    .page-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
    .page-wrapper > main { flex: 1; }
    .bg-gray { background-color: var(--bg-main); }
    .text-right { text-align: right; }
    .hidden { display: none !important; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn var(--transition-normal) forwards; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hover-lift { transition: transform var(--transition-fast), box-shadow var(--transition-fast); }
    .hover-lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }

    /* ===== NAVBAR ===== */
    .navbar {
      background-color: var(--bg-card);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 1rem 0;
    }
    .navbar-container { display: flex; align-items: center; justify-content: space-between; }
    .navbar-logo {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700;
      color: var(--text-main); text-decoration: none; cursor: pointer;
    }
    .navbar-logo-icon { font-size: 1.8rem; }
    .navbar-links { display: none; align-items: center; gap: 2rem; }
    @media (min-width: 768px) { .navbar-links { display: flex; } }
    .nav-link {
      font-size: 0.95rem; font-weight: 500; color: var(--text-muted);
      transition: color var(--transition-fast); position: relative; cursor: pointer;
      background: none; border: none; font-family: inherit;
    }
    .nav-link:hover, .nav-link.active { color: var(--primary-color); }
    .nav-link.active::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 100%; height: 2px; background-color: var(--primary-color); border-radius: 2px;
    }
    .navbar-actions { display: flex; align-items: center; gap: 1rem; }
    .btn-signin {
      display: none; align-items: center; gap: 0.5rem;
      padding: 0.5rem 1rem; border-radius: var(--radius-md);
      font-weight: 600; color: var(--primary-color);
      background-color: rgba(79, 70, 229, 0.1);
      transition: all var(--transition-fast); cursor: pointer;
    }
    .btn-signin:hover { background-color: rgba(79, 70, 229, 0.15); }
    @media (min-width: 768px) { .btn-signin { display: flex; } }
    .mobile-menu-btn { display: block; color: var(--text-main); font-size: 1.5rem; background: none; border: none; cursor: pointer; }
    @media (min-width: 768px) { .mobile-menu-btn { display: none; } }
    .mobile-menu {
      position: absolute; top: 100%; left: 0; width: 100%;
      background-color: var(--bg-card); box-shadow: var(--shadow-md);
      padding: 1rem; display: flex; flex-direction: column; gap: 1rem; z-index: 100;
    }
    .mobile-link { font-weight: 500; color: var(--text-main); padding: 0.5rem; border-radius: var(--radius-md); cursor: pointer; }
    .mobile-link:hover { background-color: var(--bg-main); }
    .mobile-signin {
      width: 100%; padding: 0.75rem; border-radius: var(--radius-md);
      background-color: var(--primary-color); color: white; font-weight: 600;
      margin-top: 0.5rem; text-align: center; cursor: pointer;
    }
    .navbar-transparent { background: transparent !important; box-shadow: none !important; }

    /* ===== HERO SECTION ===== */
    .hero { position: relative; min-height: 85vh; padding: 1rem; display: flex; flex-direction: column; }
    .hero-background-wrapper {
      position: absolute; top: 1rem; left: 1rem; right: 1rem; bottom: 0;
      border-radius: var(--radius-2xl); overflow: hidden; z-index: 1;
    }
    .hero-image { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .hero-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(245, 247, 250, 0.9) 0%, rgba(245, 247, 250, 0.4) 50%, transparent 100%);
      z-index: 2;
    }
    .hero-header-nav { position: relative; z-index: 10; padding: 1rem; }
    .hero-container {
      position: relative; z-index: 3; flex: 1; display: flex; flex-direction: column;
      justify-content: center; padding-top: 4rem; padding-bottom: 8rem;
    }
    .hero-content { max-width: 600px; margin-bottom: 4rem; }
    .hero-title { font-size: 3.5rem; line-height: 1.2; color: var(--text-main); font-weight: 400; margin-bottom: 2rem; }
    .hero-title strong { font-weight: 700; }
    @media (min-width: 768px) { .hero-title { font-size: 4.5rem; } }
    .btn-explore-now {
      font-size: 1.1rem; font-weight: 600; display: flex; align-items: center;
      gap: 0.5rem; color: var(--text-main); background: none; padding: 0; cursor: pointer;
    }
    .btn-explore-now span { transition: transform var(--transition-fast); }
    .btn-explore-now:hover span { transform: translateX(5px); }
    .hero-search-wrapper { margin-top: auto; position: relative; z-index: 20; }

    /* ===== SEARCH BOX ===== */
    .search-card-new {
      background-color: var(--bg-card); border-radius: var(--radius-xl);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); padding: 1.5rem; max-width: 900px; position: relative;
    }
    .search-tabs {
      display: flex; margin-top: -3rem; margin-left: 1rem;
      background-color: var(--bg-card); width: fit-content;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      overflow: hidden; box-shadow: 0 -10px 20px rgba(0,0,0,0.05);
    }
    .search-tab {
      display: flex; align-items: center; gap: 0.5rem; padding: 1rem 1.5rem;
      font-weight: 600; color: var(--text-muted); background: transparent;
      transition: all var(--transition-fast); cursor: pointer; border: none; font-family: inherit;
    }
    .search-tab.active { background-color: var(--text-main); color: white; }
    .search-form-new { display: flex; flex-direction: column; gap: 1.5rem; padding-top: 1rem; }
    .search-filters-top { display: flex; gap: 1.5rem; }
    .search-filters-top select {
      border: none; background: transparent; font-weight: 600; font-size: 0.9rem;
      color: var(--text-main); cursor: pointer; padding-right: 1rem; font-family: inherit;
    }
    .search-inputs-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 768px) { .search-inputs-grid { grid-template-columns: 1fr 1fr; gap: 1.5rem; } }
    .input-box {
      display: flex; border: 1px solid var(--border-light); border-radius: var(--radius-lg);
      position: relative; background-color: white;
    }
    .input-field-new { flex: 1; padding: 1rem 1.5rem; display: flex; flex-direction: column; justify-content: center; }
    .input-field-new:first-child { border-right: 1px solid var(--border-light); }
    .input-field-new label {
      font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; margin-bottom: 0.25rem;
    }
    .input-field-new input {
      font-size: 1.25rem; font-weight: 700; border: none; background: transparent;
      color: var(--text-main); padding: 0; width: 100%; outline: none; font-family: inherit;
    }
    .airport-hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    .swap-btn-new {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 32px; height: 32px; border-radius: 50%;
      background-color: var(--bg-card); border: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); z-index: 10; transition: all var(--transition-fast);
      cursor: pointer; font-size: 1rem;
    }
    .swap-btn-new:hover { color: var(--primary-color); border-color: var(--primary-color); }
    .date-input-wrapper { display: flex; align-items: center; justify-content: space-between; }
    .date-input-wrapper input { font-size: 1.1rem; }
    .date-input-wrapper .cal-icon { color: var(--text-muted); font-size: 1.2rem; }
    .date-nav { display: flex; gap: 1rem; margin-top: 0.25rem; }
    .date-nav span { font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }
    .date-nav span:hover { color: var(--primary-color); text-decoration: underline; }
    .btn-search-new {
      position: absolute; bottom: -24px; right: 2rem;
      background-color: var(--text-main); color: white; padding: 1rem 2rem;
      border-radius: var(--radius-md); font-weight: 600; display: flex;
      align-items: center; gap: 0.75rem; font-size: 1.1rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: transform var(--transition-fast);
      cursor: pointer; border: none; font-family: inherit;
    }
    .btn-search-new:hover { transform: translateY(-2px); }
    @media (max-width: 768px) {
      .btn-search-new { position: static; width: 100%; justify-content: center; margin-top: 1rem; }
    }

    /* ===== HOME PAGE SECTIONS ===== */
    .section-popular, .section-features { margin-top: 6rem; margin-bottom: 2rem; }
    .section-title { font-size: 1.75rem; margin-bottom: 2rem; color: var(--text-main); }
    .destinations-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
    .destination-card { border-radius: var(--radius-lg); overflow: hidden; position: relative; cursor: pointer; }
    .destination-img-wrapper { position: relative; height: 300px; overflow: hidden; }
    .destination-img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition-normal); }
    .destination-overlay {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }
    .destination-info { position: absolute; bottom: 0; left: 0; padding: 1.5rem; color: white; z-index: 2; }
    .destination-info h3 { font-size: 1.25rem; color: white; margin-bottom: 0.25rem; }
    .destination-info p { font-size: 0.9rem; color: rgba(255, 255, 255, 0.8); }
    .destination-card:hover .destination-img { transform: scale(1.05); }
    .features-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
    @media (min-width: 768px) { .features-grid { grid-template-columns: repeat(3, 1fr); } }
    .feature-card {
      background-color: var(--bg-card); padding: 2rem; border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); text-align: center; border: 1px solid var(--border-light);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .feature-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--primary-color); }
    .feature-icon { font-size: 3rem; margin-bottom: 1rem; }
    .feature-card h3 { margin-bottom: 1rem; font-size: 1.25rem; }
    .feature-card p { color: var(--text-muted); }

    /* ===== SEARCH RESULTS PAGE ===== */
    .search-results-main { background-color: var(--bg-main); min-height: 100vh; }
    .search-header {
      background-color: var(--primary-color); color: white; padding: 2rem 0; margin-bottom: 2rem;
    }
    .search-header h2 { color: white; margin-bottom: 0.5rem; }
    .search-header p { color: rgba(255, 255, 255, 0.8); }
    .results-container { display: flex; flex-direction: column; gap: 2rem; }
    @media (min-width: 1024px) {
      .results-container { flex-direction: row; }
      .filters-aside { width: 280px; flex-shrink: 0; }
      .results-content { flex: 1; }
    }
    .sort-options {
      display: flex; background-color: var(--bg-card); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 1.5rem;
      border: 1px solid var(--border-light);
    }
    .sort-btn {
      flex: 1; padding: 1rem; display: flex; flex-direction: column;
      align-items: center; gap: 0.25rem;
      border-right: 1px solid var(--border-light);
      transition: background-color var(--transition-fast); cursor: pointer;
      background: none; border-top: none; border-bottom: none; border-left: none;
      font-family: inherit;
    }
    .sort-btn:last-child { border-right: none; }
    .sort-btn:hover { background-color: var(--bg-main); }
    .sort-btn.active { background-color: var(--bg-main); border-bottom: 3px solid var(--primary-color); }
    .sort-btn strong { color: var(--text-main); }
    .sort-btn span { color: var(--text-muted); font-size: 0.875rem; }
    .flights-list { display: flex; flex-direction: column; gap: 1.5rem; }
    .loading-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 4rem 0; color: var(--text-muted);
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(79, 70, 229, 0.2);
      border-radius: 50%; border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite; margin-bottom: 1rem;
    }

    /* ===== FILTERS SIDEBAR ===== */
    .filters-card {
      background-color: var(--bg-card); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); padding: 1.5rem; border: 1px solid var(--border-light);
      position: sticky; top: 100px;
    }
    .filters-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-light);
    }
    .filters-header h3 { font-size: 1.25rem; }
    .reset-btn { color: var(--primary-color); font-size: 0.875rem; font-weight: 500; cursor: pointer; background: none; border: none; }
    .reset-btn:hover { text-decoration: underline; }
    .filter-section { margin-bottom: 1.5rem; }
    .filter-section:last-child { margin-bottom: 0; }
    .filter-section h4 { font-size: 1rem; margin-bottom: 1rem; }
    .filter-options { display: flex; flex-direction: column; gap: 0.75rem; }
    .checkbox-label {
      display: flex; align-items: center; cursor: pointer; position: relative;
      font-size: 0.95rem; user-select: none;
    }
    .checkbox-label input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
    .checkmark {
      position: relative; height: 20px; width: 20px; background-color: var(--bg-main);
      border: 1px solid var(--border-light); border-radius: 4px; margin-right: 0.75rem;
      transition: all var(--transition-fast); flex-shrink: 0;
    }
    .checkbox-label:hover input ~ .checkmark { border-color: var(--primary-color); }
    .checkbox-label input:checked ~ .checkmark { background-color: var(--primary-color); border-color: var(--primary-color); }
    .checkmark:after {
      content: ""; position: absolute; display: none;
      left: 6px; top: 2px; width: 5px; height: 10px;
      border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .checkbox-label input:checked ~ .checkmark:after { display: block; }
    .label-text { flex: 1; color: var(--text-main); }
    .price-hint { color: var(--text-muted); font-size: 0.85rem; }

    /* ===== FLIGHT CARD ===== */
    .flight-card {
      background-color: var(--bg-card); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
      position: relative; overflow: hidden;
    }
    .flight-tags { position: absolute; top: 0; left: 0; display: flex; }
    .badge {
      font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem;
      border-bottom-right-radius: var(--radius-md); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .badge-cheapest { background-color: var(--accent-success); color: white; }
    .badge-fastest { background-color: var(--accent-warning); color: white; }
    .badge-best-value { background-color: var(--primary-color); color: white; }
    .flight-card-inner { display: flex; flex-direction: column; padding: 1.5rem; }
    @media (min-width: 768px) { .flight-card-inner { flex-direction: row; padding: 1.5rem 2rem; } }
    .flight-info-section {
      flex: 1; display: flex; flex-direction: column; gap: 1.5rem;
      padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-light);
    }
    @media (min-width: 768px) {
      .flight-info-section {
        padding-bottom: 0; border-bottom: none;
        border-right: 1px solid var(--border-light); padding-right: 2rem;
      }
    }
    .airline-info { display: flex; align-items: center; gap: 0.75rem; }
    .airline-logo {
      font-size: 1.5rem; width: 40px; height: 40px; background-color: var(--bg-main);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-light);
    }
    .airline-name { font-weight: 500; color: var(--text-muted); }
    .flight-times { display: flex; justify-content: space-between; align-items: center; }
    .time-block { display: flex; flex-direction: column; }
    .time-block.text-right { text-align: right; }
    .time { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
    .airport { font-size: 1rem; font-weight: 500; color: var(--text-muted); }
    .flight-duration-block { display: flex; flex-direction: column; align-items: center; flex: 1; padding: 0 1rem; }
    .duration { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .duration-line { display: flex; align-items: center; width: 100%; position: relative; }
    .line { flex: 1; height: 2px; background-color: var(--border-light); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--border-light); }
    .stops { font-size: 0.85rem; color: var(--accent-warning); margin-top: 0.25rem; font-weight: 500; }
    .stops.direct { color: var(--accent-success); }
    .flight-price-section {
      display: flex; flex-direction: column; align-items: flex-start;
      justify-content: space-between; padding-top: 1.5rem; min-width: 200px;
    }
    @media (min-width: 768px) {
      .flight-price-section { padding-top: 0; padding-left: 2rem; align-items: flex-end; }
    }
    .baggage-info { display: flex; gap: 0.5rem; margin-bottom: 1rem; font-size: 1.2rem; }
    @media (min-width: 768px) { .baggage-info { margin-bottom: 0; } }
    .price-info { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 1rem; }
    @media (min-width: 768px) { .price-info { align-items: flex-end; } }
    .price { font-size: 2rem; font-weight: 700; color: var(--text-main); line-height: 1; }
    .price-type { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }
    .btn-view-deal {
      width: 100%; background-color: var(--primary-color); color: white;
      padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600;
      font-size: 1rem; transition: background-color var(--transition-fast);
      cursor: pointer; border: none; font-family: inherit;
    }
    .btn-view-deal:hover { background-color: var(--primary-hover); }

    /* ===== FLIGHT DETAILS PAGE ===== */
    .details-container { padding-top: 2rem; padding-bottom: 4rem; }
    .details-header { margin-bottom: 2rem; }
    .btn-back { color: var(--primary-color); font-weight: 500; margin-bottom: 1rem; cursor: pointer; background: none; border: none; font-family: inherit; font-size: 0.95rem; }
    .btn-back:hover { text-decoration: underline; }
    .details-header h2 { font-size: 2rem; }
    .details-content { display: grid; grid-template-columns: 1fr; gap: 2rem; }
    @media (min-width: 1024px) { .details-content { grid-template-columns: 2fr 1fr; } }
    .card {
      background-color: var(--bg-card); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
      padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .card h3 { margin-bottom: 1.5rem; font-size: 1.25rem; border-bottom: 1px solid var(--border-light); padding-bottom: 1rem; }
    .itinerary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .airline-brand { display: flex; align-items: center; gap: 0.75rem; font-weight: 600; }
    .flight-number { color: var(--text-muted); font-size: 0.875rem; }
    .flight-timeline { position: relative; padding-left: 2rem; }
    .flight-timeline::before {
      content: ''; position: absolute; left: 5px; top: 10px; bottom: 10px;
      width: 2px; background-color: var(--border-light);
    }
    .timeline-point { position: relative; margin-bottom: 2rem; }
    .timeline-point:last-child { margin-bottom: 0; }
    .timeline-point::before {

        const arriveHour = (departHour + durationHours) % 24;
        const arriveMin = Math.floor(Math.random() * 60);

        let basePrice = Math.floor(Math.random() * 15000) + 4000;
        if (stops === 0) basePrice += 3000;
        if (durationHours > 6) basePrice += 5000;

        flights.push({
          id: `f-${i}`,
          airline,
          origin: origin || 'JFK',
          destination: destination || 'LHR',
          departureTime: `${String(departHour).padStart(2,'0')}:${String(departMin).padStart(2,'0')}`,
          arrivalTime: `${String(arriveHour).padStart(2,'0')}:${String(arriveMin).padStart(2,'0')}`,
          duration: `${durationHours}h ${durationMinutes}m`,
          stops,
          price: basePrice,
          currency: 'INR',
          baggage: { cabin: true, checked: Math.random() > 0.5 },
          refundable: Math.random() > 0.7,
          tags: i === 0 ? ['Cheapest'] : i === 1 ? ['Fastest'] : i === 2 ? ['Best Value'] : [],
        });
      }
      return flights.sort((a, b) => a.price - b.price);
    }

                <span class="deal-price">${deal.price}</span>
              </div>
              <button class="btn-grab-deal" onclick="navigate('#/search?from=${deal.from}&to=${deal.title}')">Grab Deal</button>
            </div>
          </div>
        </div>
      `).join('');

      return `
        <div class="page-wrapper bg-gray">
          ${renderNavbar(false)}
          <main class="container deals-container">
            <div class="deals-header animate-fade-in">
              <div class="deals-badge">🏷️ Special Offers</div>
              <h2>Flash Sales & Last Minute Deals</h2>
              <p>Book now and save big on these hand-picked premium flights.</p>
            </div>
            <div class="deals-grid">${dealsHTML}</div>
          </main>
          ${renderFooter()}
        </div>`;
    }

    function renderMyTripsPage() {
      const trips = JSON.parse(localStorage.getItem('flycompare_trips')) || [];

      let contentHTML;
      if (trips.length === 0) {
        contentHTML = `
          <div class="empty-trips animate-fade-in">
            <div class="empty-icon">✈️</div>
            <h3>Your trips are empty</h3>
            <p>Looks like you haven't booked any flights yet.</p>
            <button class="btn-search-flights" onclick="navigate('#/')">Search Flights</button>
          </div>`;
      } else {
        contentHTML = `<div class="trips-list">${trips.map((trip, index) => `
          <div class="trip-card hover-lift animate-fade-in" style="animation-delay: ${index * 100}ms">
            <div class="trip-card-header">
              <span class="booking-ref">Ref: ${trip.bookingRef}</span>
              <span class="trip-status">Confirmed</span>
            </div>
            <div class="trip-card-body">
              <div class="trip-route">
                <div class="route-city"><strong>${trip.origin}</strong><span>Departure</span></div>
                <div class="route-icon">✈️</div>
                <div class="route-city text-right"><strong>${trip.destination}</strong><span>Arrival</span></div>
              </div>
              <div class="trip-details-grid">
                <div class="detail-item"><span>Date</span><strong>${new Date(trip.date).toLocaleDateString()}</strong></div>
                <div class="detail-item"><span>Passengers</span><strong>${trip.passengers} Adult</strong></div>
                <div class="detail-item"><span>Total Price</span><strong>₹${trip.price.toLocaleString('en-IN')}</strong></div>
              </div>
            </div>
            <div class="trip-card-footer">
              <button class="btn-manage">Manage Booking</button>
              <button class="btn-checkin">Online Check-in</button>
            </div>
          </div>
        `).join('')}</div>`;
      }

      return `
        <div class="page-wrapper bg-gray">
          ${renderNavbar(false)}
          <main class="container trips-container">
            <div class="trips-header animate-fade-in">
              <h2>My Trips</h2>
              <p>Manage your upcoming flights and past bookings.</p>
            </div>
            ${contentHTML}
          </main>
          ${renderFooter()}
        </div>`;
    }

    
    let currentFlights = [];

    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      if (menu) menu.classList.toggle('hidden');
    }

    function closeMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      if (menu) menu.classList.add('hidden');
    }

    function setSearchTab(tab) {
      document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
      const el = document.getElementById('tab-' + tab);
      if (el) el.classList.add('active');
    }

    function swapLocations() {
      const fromEl = document.getElementById('search-from');
      const toEl = document.getElementById('search-to');
      if (fromEl && toEl) {
        const temp = fromEl.value;
        fromEl.value = toEl.value;
        toEl.value = temp;
      }
    }

    function handleSearch(e) {
      e.preventDefault();
      const from = document.getElementById('search-from').value;
      const to = document.getElementById('search-to').value;
      navigate(`#/search?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
    }

    function handleBooking(e) {
      e.preventDefault();
      navigate('#/confirmation');
    }

    function loadFlights(from, to) {
      currentFlights = generateMockFlights(from, to);
      setTimeout(() => {
        const loadingEl = document.getElementById('flights-loading');
        const listEl = document.getElementById('flights-list');
        if (loadingEl) loadingEl.classList.add('hidden');
        if (listEl) {
          listEl.classList.remove('hidden');
          listEl.innerHTML = currentFlights.map(f => renderFlightCard(f)).join('');
        }
      }, 1500);
    }

    function sortFlights(type) {
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('sort-' + type);
      if (btn) btn.classList.add('active');

      if (type === 'cheapest') currentFlights.sort((a, b) => a.price - b.price);
      else if (type === 'fastest') currentFlights.sort((a, b) => parseInt(a.duration) - parseInt(b.duration));

      const listEl = document.getElementById('flights-list');
      if (listEl) listEl.innerHTML = currentFlights.map(f => renderFlightCard(f)).join('');
    }

    function openExploreModal(id) {
      const item = exploreData.find(d => d.id === id);
      if (!item) return;
      const modalEl = document.getElementById('explore-modal');
      if (!modalEl) return;
      modalEl.innerHTML = `
        <div class="place-modal-overlay" onclick="closeExploreModal()">
          <div class="place-modal-content" onclick="event.stopPropagation()">
            <img src="${item.image}" alt="${item.landmark}" />
            <h2>${item.landmark}, ${item.country}</h2>
            <p>${item.description}</p>
            <div class="modal-info"><strong>Best time to visit:</strong> ${item.bestTime}</div>
            <div class="modal-info" style="margin-bottom: 20px"><strong>Currency:</strong> ${item.currency}</div>
            <div class="modal-actions">
              <button class="btn-primary-modal" onclick="navigate('#/search?to=${item.country}')">Search Flights</button>
              <button class="btn-secondary-modal" onclick="closeExploreModal()">Close</button>
            </div>
          </div>
        </div>`;
    }

    function closeExploreModal() {
      const modalEl = document.getElementById('explore-modal');
      if (modalEl) modalEl.innerHTML = '';
    }

    function navigate(hash) {
      window.location.hash = hash.startsWith('#') ? hash.substring(1) : hash;
    }

    function getParams(hash) {
      const qIndex = hash.indexOf('?');
      if (qIndex === -1) return {};
      const search = hash.substring(qIndex + 1);
      const params = {};
      search.split('&').forEach(pair => {
        const [key, value] = pair.split('=');
        params[decodeURIComponent(key)] = decodeURIComponent(value || '');
      });
      return params;
    }

    function router() {
      const hash = window.location.hash || '#/';
      const path = hash.replace('#', '').split('?')[0];
      const app = document.getElementById('app');

      window.scrollTo(0, 0);

      if (path === '/' || path === '') {
        app.innerHTML = renderHomePage();
      } else if (path === '/search') {
        const params = getParams(hash);
        const from = params.from || 'JFK';
        const to = params.to || 'LHR';
        app.innerHTML = renderSearchResultsPage(from, to);
        loadFlights(from, to);
      } else if (path.startsWith('/flight/')) {
        const flightId = path.split('/flight/')[1];
        app.innerHTML = renderFlightDetailsPage(flightId);
      } else if (path.startsWith('/book/')) {
        app.innerHTML = renderBookingReviewPage();
      } else if (path === '/confirmation') {
        app.innerHTML = renderConfirmationPage();
      } else if (path === '/sign-in') {
        app.innerHTML = renderSignInPage();
      } else if (path === '/explore') {
        app.innerHTML = renderExplorePage();
      } else if (path === '/deals') {
        app.innerHTML = renderDealsPage();
      } else if (path === '/my-trips') {
        app.innerHTML = renderMyTripsPage();
      } else {
        app.innerHTML = renderHomePage();
      }
    }


    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
</body>
</html>
