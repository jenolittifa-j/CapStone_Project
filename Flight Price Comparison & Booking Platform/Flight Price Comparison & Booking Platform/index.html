<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="FlyCompare - Flight Price Comparison and Booking Platform">
<title>FlyCompare - Flight Price Comparison & Booking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#4f46e5;
    --primary-hover:#4338ca;
    --secondary:#0ea5e9;
    --success:#10b981;
    --warning:#f59e0b;
    --danger:#ef4444;
    --bg:#f8fafc;
    --white:#fff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --shadow:0 4px 15px rgba(0,0,0,.08);
    --shadow-lg:0 15px 40px rgba(0,0,0,.12);
    --radius:12px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
}

h1,h2,h3,h4{
    font-family:'Poppins',sans-serif;
}

button,input,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

.hidden{
    display:none!important;
}

/* NAVBAR */

.navbar{
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    position:sticky;
    top:0;
    z-index:100;
}

.nav-container{
    height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:'Poppins';
    font-size:24px;
    font-weight:700;
    cursor:pointer;
}

.logo span{
    color:var(--primary);
}

.nav-links{
    display:flex;
    gap:30px;
}

.nav-links button{
    border:0;
    background:none;
    color:var(--muted);
    font-weight:600;
    font-size:15px;
}

.nav-links button:hover{
    color:var(--primary);
}

.nav-actions{
    display:flex;
    gap:10px;
    align-items:center;
}

.btn{
    border:0;
    padding:11px 18px;
    border-radius:8px;
    font-weight:600;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-hover);
}

.btn-outline{
    background:white;
    border:1px solid var(--primary);
    color:var(--primary);
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.mobile-menu-btn{
    display:none;
    background:none;
    border:0;
    font-size:26px;
}

/* HERO */

.hero{
    min-height:680px;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.hero-bg{
    position:absolute;
    inset:0;
    background-image:
    linear-gradient(
        90deg,
        rgba(255,255,255,.96),
        rgba(255,255,255,.7),
        rgba(255,255,255,.15)
    ),
    url("https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1920&q=80");
    background-size:cover;
    background-position:center;
}

.hero-content{
    position:relative;
    z-index:2;
    padding-top:60px;
}

.hero-content h1{
    font-size:64px;
    line-height:1.15;
    max-width:650px;
    margin-bottom:25px;
}

.hero-content h1 strong{
    color:var(--primary);
}

.hero-content p{
    color:var(--muted);
    font-size:18px;
    margin-bottom:30px;
}

/* SEARCH */

.search-card{
    position:relative;
    background:white;
    border-radius:18px;
    padding:25px;
    max-width:1000px;
    box-shadow:var(--shadow-lg);
    margin-top:40px;
}

.search-tabs{
    display:flex;
    gap:5px;
    margin-bottom:20px;
}

.search-tabs button{
    padding:12px 20px;
    border:0;
    background:#f1f5f9;
    border-radius:8px;
    font-weight:600;
}

.search-tabs button.active{
    background:var(--primary);
    color:white;
}

.search-top{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.search-top select{
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
}

.search-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.search-box{
    display:flex;
    border:1px solid var(--border);
    border-radius:10px;
    position:relative;
}

.field{
    flex:1;
    padding:15px;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:5px;
}

.field input{
    width:100%;
    border:0;
    outline:0;
    font-size:18px;
    font-weight:600;
}

.hint{
    color:var(--muted);
    font-size:12px;
}

.swap{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:white;
    z-index:3;
}

.search-btn{
    margin-top:20px;
    background:var(--text);
    color:white;
    border:0;
    padding:14px 25px;
    border-radius:8px;
    font-weight:700;
    float:right;
}

/* SECTIONS */

.section{
    padding:70px 0;
}

.section-title{
    font-size:30px;
    margin-bottom:30px;
}

.destination-grid,
.features-grid,
.explore-grid,
.deals-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.destination{
    height:280px;
    position:relative;
    overflow:hidden;
    border-radius:14px;
    cursor:pointer;
}

.destination img,
.explore-card img,
.deal-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.destination-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(transparent,rgba(0,0,0,.8));
}

.destination-info{
    position:absolute;
    bottom:20px;
    left:20px;
    color:white;
}

.destination-info h3{
    color:white;
}

.feature{
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:var(--shadow);
    text-align:center;
}

.feature-icon{
    font-size:45px;
    margin-bottom:15px;
}

.feature p{
    color:var(--muted);
}

/* RESULTS */

.page{
    min-height:calc(100vh - 75px);
}

.results-header{
    background:var(--primary);
    color:white;
    padding:35px 0;
}

.results-header h2{
    color:white;
}

.results-header p{
    margin-top:8px;
    opacity:.85;
}

.results-layout{
    display:grid;
    grid-template-columns:270px 1fr;
    gap:25px;
    padding-top:30px;
}

.filters{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:var(--shadow);
    height:max-content;
}

.filter-section{
    margin-bottom:25px;
}

.filter-section h4{
    margin-bottom:12px;
}

.filter-section label{
    display:block;
    margin:10px 0;
    color:var(--muted);
}

.sort{
    background:white;
    border-radius:12px;
    padding:10px;
    display:flex;
    margin-bottom:20px;
}

.sort button{
    flex:1;
    padding:12px;
    border:0;
    background:white;
}

.sort button.active{
    background:#eef2ff;
    color:var(--primary);
    border-radius:8px;
}

.flight-card{
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:18px;
    padding:22px;
    box-shadow:var(--shadow);
}

.flight-top{
    display:flex;
    justify-content:space-between;
}

.airline{
    font-weight:700;
}

.flight-main{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    gap:20px;
    margin:20px 0;
}

.time{
    font-size:25px;
    font-weight:700;
}

.airport{
    color:var(--muted);
}

.duration{
    text-align:center;
    color:var(--muted);
}

.line{
    height:2px;
    background:var(--border);
    margin:7px 0;
}

.flight-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.price{
    font-size:26px;
    font-weight:700;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    background:#dcfce7;
    color:#15803d;
    font-size:12px;
    font-weight:700;
}

/* FORMS */

.form-page{
    min-height:calc(100vh - 75px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 20px;
}

.form-card{
    background:white;
    width:100%;
    max-width:470px;
    padding:35px;
    border-radius:16px;
    box-shadow:var(--shadow-lg);
}

.form-card h2{
    text-align:center;
    margin-bottom:8px;
}

.form-subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.form-group input,
.form-group select{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:var(--primary);
}

.full-btn{
    width:100%;
    padding:14px;
    margin-top:5px;
}

.form-footer{
    text-align:center;
    margin-top:20px;
    color:var(--muted);
}

.form-footer a{
    color:var(--primary);
    font-weight:700;
    cursor:pointer;
}

.error{
    background:#fee2e2;
    color:#b91c1c;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#dcfce7;
    color:#15803d;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    display:none;
}

/* OTP */

.otp-box{
    text-align:center;
}

.otp-box input{
    text-align:center;
    font-size:28px;
    letter-spacing:10px;
    font-weight:700;
}

.demo-otp{
    margin-top:15px;
    background:#fff7ed;
    color:#c2410c;
    padding:12px;
    border-radius:8px;
    font-weight:600;
}

/* DETAILS */

.details{
    padding:40px 20px;
}

.details-layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

.card{
    background:white;
    border-radius:14px;
    padding:25px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.timeline{
    border-left:3px solid var(--primary);
    padding-left:25px;
}

.timeline-item{
    margin-bottom:30px;
}

.timeline-item strong{
    font-size:20px;
}

/* BOOKING */

.booking{
    max-width:800px;
    margin:auto;
    padding:50px 20px;
}

/* CONFIRMATION */

.confirmation{
    min-height:600px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.confirm-card{
    background:white;
    padding:50px;
    border-radius:18px;
    text-align:center;
    box-shadow:var(--shadow-lg);
    max-width:550px;
}

.success-icon{
    font-size:70px;
}

.booking-ref{
    background:#f1f5f9;
    padding:20px;
    margin:25px 0;
    border-radius:10px;
}

.booking-ref strong{
    display:block;
    color:var(--primary);
    font-size:30px;
    letter-spacing:5px;
}

/* EXPLORE */

.explore-card{
    height:380px;
    position:relative;
    overflow:hidden;
    border-radius:15px;
    cursor:pointer;
}

.explore-overlay{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:25px;
    color:white;
    background:linear-gradient(transparent,rgba(0,0,0,.9));
}

.explore-overlay h3{
    color:white;
}

/* DEALS */

.deal-card{
    height:400px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

.deal-image{
    height:220px!important;
}

.deal-content{
    padding:20px;
}

.deal-price{
    font-size:25px;
    color:var(--primary);
    font-weight:700;
}

.old-price{
    color:var(--muted);
    text-decoration:line-through;
    margin-right:10px;
}

/* TRIPS */

.trip-card{
    background:white;
    border-radius:15px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
    overflow:hidden;
}

.trip-header{
    background:#f1f5f9;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
}

.trip-body{
    padding:25px;
}

.trip-route{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.trip-route strong{
    font-size:30px;
}

.trip-footer{
    padding:15px 20px;
    border-top:1px solid var(--border);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
}

.modal-content{
    background:white;
    padding:30px;
    border-radius:15px;
    max-width:500px;
    width:100%;
}

.notification{
    position:fixed;
    top:90px;
    right:20px;
    background:#0f172a;
    color:white;
    padding:16px 20px;
    border-radius:10px;
    box-shadow:var(--shadow-lg);
    z-index:2000;
    max-width:350px;
}

/* FOOTER */

footer{
    background:#0f172a;
    color:white;
    padding:50px 0 20px;
    margin-top:50px;
}

.footer-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:30px;
}

footer h3{
    color:white;
    margin-bottom:15px;
}

footer p,
footer a{
    color:#94a3b8;
    display:block;
    margin-bottom:8px;
}

.copyright{
    text-align:center;
    border-top:1px solid #334155;
    margin-top:30px;
    padding-top:20px;
    color:#94a3b8;
}

/* RESPONSIVE */

@media(max-width:900px){

    .nav-links{
        display:none;
    }

    .mobile-menu-btn{
        display:block;
    }

    .hero-content h1{
        font-size:45px;
    }

    .destination-grid,
    .explore-grid,
    .deals-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .features-grid{
        grid-template-columns:1fr;
    }

    .results-layout{
        grid-template-columns:1fr;
    }

    .details-layout{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    .hero{
        min-height:800px;
    }

    .hero-content h1{
        font-size:38px;
    }

    .search-grid{
        grid-template-columns:1fr;
    }

    .search-top{
        flex-wrap:wrap;
    }

    .flight-main{
        grid-template-columns:1fr;
        text-align:center;
    }

    .flight-bottom{
        flex-direction:column;
        gap:15px;
    }

    .destination-grid,
    .explore-grid,
    .deals-grid{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr;
    }

    .form-card{
        padding:25px 20px;
    }
}
</style>
</head>

/* =====================================================
   USER / AUTHENTICATION
===================================================== */

function getUsers(){
    return JSON.parse(localStorage.getItem("flycompare_users")) || [];
}

function saveUsers(users){
    localStorage.setItem(
        "flycompare_users",
        JSON.stringify(users)
    );
}

function getCurrentUser(){
    return JSON.parse(
        localStorage.getItem("flycompare_current_user")
    );
}

function saveCurrentUser(user){
    localStorage.setItem(
        "flycompare_current_user",
        JSON.stringify(user)
    );
}

function logout(){

    localStorage.removeItem(
        "flycompare_current_user"
    );

    showNotification(
        "You have been logged out successfully."
    );

    navigate("#/");
}


/* =====================================================
   NOTIFICATION
===================================================== */

function showNotification(message){

    const old = document.querySelector(".notification");

    if(old){
        old.remove();
    }

    const notification =
    document.createElement("div");

    notification.className="notification";

    notification.innerHTML =
    "🔔 <strong>FlyCompare</strong><br>" +
    message;

    document.body.appendChild(notification);

    setTimeout(()=>{
        notification.remove();
    },4000);
}


/*
    Browser notification.

    This is NOT SMS.

    It displays a notification if the browser
    gives permission.
*/

async function browserNotification(message){

    if(!("Notification" in window)){
        return;
    }

    if(Notification.permission === "default"){
        await Notification.requestPermission();
    }

    if(Notification.permission === "granted"){

        new Notification(
            "FlyCompare",
            {
                body:message,
                icon:"https://cdn-icons-png.flaticon.com/512/723/723955.png"
            }
        );
    }
}

function searchFlights(event){

    event.preventDefault();

    const from=document.getElementById("from").value;
    const to=document.getElementById("to").value;

    navigate(
        "#/search?from="+
        encodeURIComponent(from)+
        "&to="+
        encodeURIComponent(to)
    );
}

function searchDestination(city){

    navigate(
        "#/search?from=New%20York&to="+
        encodeURIComponent(city)
    );
}

function swapLocations(){

    const from=document.getElementById("from");
    const to=document.getElementById("to");

    if(from && to){

        const temp=from.value;

        from.value=to.value;
        to.value=temp;

    }
}

let flights=[];

function generateFlights(from,to){

    const result=[];

    for(let i=0;i<12;i++){

        const airline=
            airlines[
                Math.floor(
                    Math.random()*airlines.length
                )
            ];

        const price=
            Math.floor(
                Math.random()*15000
            )+4500;

        const duration=
            Math.floor(
                Math.random()*8
            )+2;

        const stops=
            Math.floor(
                Math.random()*3
            );

        result.push({

            id:"FL"+(1000+i),

            airline:airline,

            from:from,

            to:to,

            departure:
                String(
                    Math.floor(
                        Math.random()*18
                    )+4
                ).padStart(2,"0")+":30",

            arrival:"20:45",

            duration:duration+"h",

            stops:stops,

            price:price,

            refundable:
                Math.random()>.4

        });
    }

    return result.sort(
        (a,b)=>a.price-b.price
    );
}

    return flights.map(f=>`

    `).join("");
}

function sortFlightResults(type, clickedButton){

    /* Keep the same FlyCompare design, but make all three
       sorting tabs fully functional and visibly selectable. */

    if(type==="cheap"){

        flights.sort((a,b)=>{
            const priceDifference = a.price - b.price;
            if(priceDifference !== 0) return priceDifference;
            return parseInt(a.duration) - parseInt(b.duration);
        });

    }else if(type==="fast"){

        flights.sort((a,b)=>{
            const durationDifference =
                parseInt(a.duration) - parseInt(b.duration);

            if(durationDifference !== 0){
                return durationDifference;
            }

            if(a.stops !== b.stops){
                return a.stops - b.stops;
            }

            return a.price - b.price;
        });

    }else if(type==="best"){

        /* Best = balanced price + duration + stops.
           Lower score means a better overall flight. */
        flights.sort((a,b)=>{
            const aDuration=parseInt(a.duration);
            const bDuration=parseInt(b.duration);

            const aScore=
                a.price +
                (aDuration * 650) +
                (a.stops * 2200);

            const bScore=
                b.price +
                (bDuration * 650) +
                (b.stops * 2200);

            return aScore - bScore;
        });
    }

    /* Update the active tab without changing the existing CSS. */
    const tabs=document.querySelectorAll("#flightSortTabs button");

    tabs.forEach(button=>{
        button.classList.remove("active");
    });

    if(clickedButton){
        clickedButton.classList.add("active");
    }else{
        const activeTab=
            document.querySelector(
                '#flightSortTabs button[data-sort="'+type+'"]'
            );

        if(activeTab){
            activeTab.classList.add("active");
        }
    }

    const list=
        document.getElementById("flightList");

    if(list){
        list.innerHTML=renderFlights();
    }

    showNotification(
        type==="cheap"
        ? "Flights sorted by cheapest price."
        : type==="fast"
        ? "Flights sorted by fastest travel time."
        : "Flights sorted by best overall option."
    );
}

function registerUser(event){

    event.preventDefault();

    const firstName=
        document.getElementById(
            "regFirstName"
        ).value.trim();

    const lastName=
        document.getElementById(
            "regLastName"
        ).value.trim();

    const email=
        document.getElementById(
            "regEmail"
        ).value.trim().toLowerCase();

    const phone=
        document.getElementById(
            "regPhone"
        ).value.trim();

    const password=
        document.getElementById(
            "regPassword"
        ).value;

    const confirmPassword=
        document.getElementById(
            "regConfirmPassword"
        ).value;

    const error=
        document.getElementById(
            "registerError"
        );

    const success=
        document.getElementById(
            "registerSuccess"
        );

    error.style.display="none";
    success.style.display="none";


    if(password!==confirmPassword){

        error.innerText=
            "Passwords do not match.";

        error.style.display="block";

        return;
    }


    const users=getUsers();

    const exists=
        users.find(
            u=>u.email===email
        );

    if(exists){

        error.innerText=
            "Email already registered. Please login.";

        error.style.display="block";

        return;
    }


    const user={
        id:Date.now(),
        firstName,
        lastName,
        email,
        phone,
        password
    };


    users.push(user);

    saveUsers(users);


    /*
        Create OTP
    */

    const otp=
        Math.floor(
            100000+
            Math.random()*900000
        ).toString();


    sessionStorage.setItem(
        "flycompare_otp",
        otp
    );

    sessionStorage.setItem(
        "flycompare_pending_user",
        JSON.stringify(user)
    );


    success.innerHTML=
        "Registration successful! OTP sent to your phone.";

    success.style.display="block";


    showNotification(
        "OTP generated for phone verification."
    );

    browserNotification(
        "Your FlyCompare verification OTP is "+otp
    );


    setTimeout(()=>{
        navigate("#/verify-otp");
    },1000);
}

function verifyOTP(){

    const entered=
        document.getElementById(
            "otpInput"
        ).value.trim();

    const actual=
        sessionStorage.getItem(
            "flycompare_otp"
        );

    const error=
        document.getElementById(
            "otpError"
        );


    if(entered!==actual){

        error.innerText=
            "Invalid OTP. Please try again.";

        error.style.display="block";

        return;
    }


    const user=
        JSON.parse(
            sessionStorage.getItem(
                "flycompare_pending_user"
            )
        );


    user.phoneVerified=true;

    const users=getUsers();

    const index=
        users.findIndex(
            u=>u.email===user.email
        );

    if(index!==-1){

        users[index]=user;

        saveUsers(users);
    }


    saveCurrentUser(user);


    sessionStorage.removeItem(
        "flycompare_otp"
    );

    sessionStorage.removeItem(
        "flycompare_pending_user"
    );


    showNotification(
        "Phone number verified successfully!"
    );


    browserNotification(
        "Your FlyCompare account is verified."
    );


    setTimeout(()=>{
        navigate("#/");
    },1000);
}

function resendOTP(){

    const otp=
        Math.floor(
            100000+
            Math.random()*900000
        ).toString();

    sessionStorage.setItem(
        "flycompare_otp",
        otp
    );

    showNotification(
        "New OTP generated."
    );

    browserNotification(
        "Your new FlyCompare OTP is "+otp
    );

    router();
}

        );

            method==="Google Pay"

            method==="PhonePe"

            : "white";
    }

    box.innerHTML=`

function makePayment(){

    if(!selectedPaymentMethod){

        showNotification(
            "Please select Google Pay or PhonePe."
        );

        return;
    }

    const upiElement=
        document.getElementById(
            "upiId"
        );

    if(!upiElement){
        return;
    }

    const upi=upiElement.value.trim();

    if(!upi){

        showNotification(
            "Please enter your UPI ID."
        );

        return;
    }

    if(!upi.includes("@")){

        showNotification(
            "Please enter a valid UPI ID."
        );

        return;
    }

    const flight=
        JSON.parse(
            sessionStorage.getItem(
                "flycompare_selected_flight"
            )
        );

    const passenger=
        JSON.parse(
            sessionStorage.getItem(
                "flycompare_passenger"
            )
        );

    const payment={

        method:selectedPaymentMethod,

        upi:upi,

        transactionId:
            "TXN"+
            Date.now(),

        amount:
            flight.price+4500,

        status:"SUCCESS",

        paidAt:
            new Date().toISOString()
    };

    sessionStorage.setItem(
        "flycompare_payment",
        JSON.stringify(payment)
    );

    showNotification(
        selectedPaymentMethod+
        " payment successful!"
    );

    browserNotification(
        "Payment successful. Your FlyCompare booking is ready for confirmation."
    );

    setTimeout(()=>{

        navigate(
            "#/payment-success"
        );

    },1000);
}

function completeBooking(){

    const flight=
        JSON.parse(
            sessionStorage.getItem(
                "flycompare_selected_flight"
            ) || "null"
        );

    const passenger=
        JSON.parse(
            sessionStorage.getItem(
                "flycompare_passenger"
            ) || "null"
        );

    const payment=
        JSON.parse(
            sessionStorage.getItem(
                "flycompare_payment"
            ) || "null"
        );

    const user=getCurrentUser();

    if(!flight || !passenger || !payment || !user){

        showNotification(
            "Booking information is incomplete."
        );

        navigate("#/");
        return;
    }

    const bookingRef=
        "FC"+
        Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();

    const trip={

        bookingRef:bookingRef,

        userId:user.id,

        origin:flight.from,

        destination:flight.to,

        airline:flight.airline.name,

        airlineLogo:flight.airline.logo,

        departure:flight.departure,

        arrival:flight.arrival,

        duration:flight.duration,

        stops:flight.stops,

        date:new Date().toISOString(),

        passengers:1,

        price:payment.amount,

        passenger:passenger,

        payment:payment,

        status:"Confirmed"
    };

    const trips=
        JSON.parse(
            localStorage.getItem(
                "flycompare_trips"
            )
        ) || [];

    trips.unshift(trip);

    localStorage.setItem(
        "flycompare_trips",
        JSON.stringify(trips)
    );

    sessionStorage.setItem(
        "latest_booking",
        JSON.stringify(trip)
    );

    sessionStorage.removeItem(
        "flycompare_passenger"
    );

    sessionStorage.removeItem(
        "flycompare_payment"
    );

    showNotification(
        "Booking confirmed successfully!"
    );

    browserNotification(
        "Your flight booking is confirmed. Reference: "+
        bookingRef
    );

    navigate("#/confirmation");
}

function downloadTicket(ref){

    const trip=
        JSON.parse(
            sessionStorage.getItem(
                "latest_booking"
            ) || "null"
        );

    const content=
`FLYCOMPARE
====================================
BOOKING CONFIRMED
====================================

Booking Reference: ${ref}

Airline: ${trip ? trip.airline : "FlyCompare"}
Route: ${trip ? trip.origin+" -> "+trip.destination : ""}
Departure: ${trip ? trip.departure : ""}
Arrival: ${trip ? trip.arrival : ""}

Passenger: ${trip ? trip.passenger.firstName+" "+trip.passenger.lastName : ""}
Date of Birth: ${trip ? trip.passenger.dob : ""}
Gender: ${trip ? trip.passenger.gender : ""}
Passport / ID: ${trip ? trip.passenger.passportId : ""}
Email: ${trip ? trip.passenger.email : ""}
Phone: ${trip ? trip.passenger.phone : ""}

Amount Paid: ₹${trip ? trip.price : ""}
Payment Method: ${trip ? trip.payment.method : ""}
Transaction ID: ${trip ? trip.payment.transactionId : ""}
Status: ${trip ? trip.status : "Confirmed"}

Thank you for booking with FlyCompare.
Have a safe journey!
====================================`;

    const blob=
        new Blob(
            [content],
            {type:"text/plain"}
        );

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;

    a.download=
        "FlyCompare-Ticket-"+
        ref+
        ".txt";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}

                            <div class="trip-route">

                                <div>

                                    <strong>
                                        ${trip.origin}
                                    </strong>

                                    <p>
                                        Departure
                                        ${trip.departure || ""}
                                    </p>

                                </div>

                                <div>
                                    ✈️
                                </div>

                                <div>

                                    <strong>
                                        ${trip.destination}
                                    </strong>

                                    <p>
                                        Arrival
                                        ${trip.arrival || ""}
                                    </p>

                                </div>

                            </div>

                            <p>
                                Airline:
                                ${trip.airline || ""}
                            </p>

                            <br>

                            <p>
                                Passenger:
                                ${trip.passenger
                                  ? trip.passenger.firstName+
                                    " "+
                                    trip.passenger.lastName
                                  : ""}
                            </p>

                            <br>

                            <p>
                                Date:
                                ${new Date(
                                    trip.date
                                ).toLocaleDateString()}
                            </p>

                            <br>

                            <p>
                                Payment:
                                ${trip.payment
                                  ? trip.payment.method
                                  : ""}
                            </p>

                            <br>

                            <p>
                                Total:
                                <strong>
                                    ₹${trip.price.toLocaleString("en-IN")}
                                </strong>
                            </p>

                        </div>

                        <div class="trip-footer">

                            <button
                                class="btn btn-primary"
                                onclick="viewTrip('${trip.bookingRef}')"
                            >
                                View Booking
                            </button>

                            <button
                                class="btn btn-outline"
                                onclick="downloadTicket('${trip.bookingRef}')"
                            >
                                Download Ticket
                            </button>

                        </div>

                    </div>

                `).join("")
            }

        </div>

    </main>

    ${footer()}

    `;
}

function viewTrip(ref){

    const trips=
        JSON.parse(
            localStorage.getItem(
                "flycompare_trips"
            )
        ) || [];

    const trip=
        trips.find(
            t=>t.bookingRef===ref
        );

    if(!trip){

        showNotification(
            "Booking not found."
        );

        return;
    }

    sessionStorage.setItem(
        "latest_booking",
        JSON.stringify(trip)
    );

    navigate("#/confirmation");
}

/* =====================================================
   ROUTER
===================================================== */

function navigate(hash){

    window.location.hash=
        hash.startsWith("#")
        ?
        hash
        :
        "#"+hash;
}

function getParams(){

    const query=
        window.location.hash.split("?")[1];

    const params={};

    if(!query){
        return params;
    }

    query.split("&").forEach(pair=>{

        const [key,value]=pair.split("=");

        params[
            decodeURIComponent(key)
        ]=
            decodeURIComponent(value||"");

    });

    return params;
}

function router(){

    const hash=
        window.location.hash || "#/";

    const path=
        hash
        .replace("#","")
        .split("?")[0];


    window.scrollTo(0,0);


    if(path==="/"){

        document.getElementById("app")
            .innerHTML=homePage();

    }

    else if(path==="/login"){

        document.getElementById("app")
            .innerHTML=loginPage();

    }

    else if(path==="/register"){

        document.getElementById("app")
            .innerHTML=registerPage();

    }

    else if(path==="/verify-otp"){

        document.getElementById("app")
            .innerHTML=otpPage();

    }

    else if(path==="/explore"){

        document.getElementById("app")
            .innerHTML=explorePage();

    }

    else if(path==="/deals"){

        document.getElementById("app")
            .innerHTML=dealsPage();

    }

    else if(path==="/my-trips"){

        document.getElementById("app")
            .innerHTML=myTripsPage();

    }

    else if(path==="/search"){

        const params=getParams();

        const from=
            params.from || "New York";

        const to=
            params.to || "London";

        document.getElementById("app")
            .innerHTML=
            searchPage(from,to);

    }

    else if(path.startsWith("/flight/")){

        const id=
            path.split("/flight/")[1];

        document.getElementById("app")
            .innerHTML=
            flightDetailsPage(id);

    }

    else if(path.startsWith("/book/")){

        const id=
            path.split("/book/")[1];

        document.getElementById("app")
            .innerHTML=
            bookingPage(id);

    }

    else if(path.startsWith("/payment/")){

        const id=
            decodeURIComponent(
                path.split("/payment/")[1]
            );

        document.getElementById("app")
            .innerHTML=
            paymentPage(id);

    }

    else if(path==="/payment-success"){

        document.getElementById("app")
            .innerHTML=
            paymentSuccessPage();

    }

    else if(path==="/confirmation"){

        document.getElementById("app")
            .innerHTML=
            confirmationPage();

    }

    else{

        document.getElementById("app")
            .innerHTML=
            homePage();

    }

}


/* =====================================================
   START APPLICATION
===================================================== */

window.addEventListener(
    "hashchange",
    router
);

window.addEventListener(
    "DOMContentLoaded",
    router
);
